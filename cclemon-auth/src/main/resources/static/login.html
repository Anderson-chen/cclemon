<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #F0F9FF;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #0C4A6E;
      line-height: 1.5;
    }

    /* ── Card ─────────────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 4px 24px rgba(3, 105, 161, .1), 0 1px 4px rgba(3, 105, 161, .06);
      border: 1px solid #BAE6FD;
    }

    /* ── Header ───────────────────────────────────────────── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-wrap {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0369A1 0%, #0EA5E9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(3, 105, 161, .3);
    }

    .logo-wrap svg { width: 30px; height: 30px; fill: #fff; }

    .header h1 {
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0C4A6E;
      margin-bottom: 4px;
    }

    .header p {
      font-size: .875rem;
      color: #0369A1;
      opacity: .7;
    }

    /* ── Error Banner ─────────────────────────────────────── */
    .error-banner {
      display: none;
      align-items: center;
      gap: 10px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #991B1B;
      border-radius: 8px;
      padding: 11px 14px;
      margin-bottom: 20px;
      font-size: .8125rem;
      font-weight: 500;
    }

    .error-banner.visible { display: flex; }
    .error-banner svg { width: 16px; height: 16px; fill: #EF4444; flex-shrink: 0; }

    /* ── Field ────────────────────────────────────────────── */
    .field { margin-bottom: 14px; }
    .field.field-mb { margin-bottom: 20px; }

    .field label {
      display: block;
      font-size: .8125rem;
      font-weight: 600;
      color: #0C4A6E;
      margin-bottom: 5px;
    }

    .input-wrap { position: relative; }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .input-icon svg { width: 17px; height: 17px; fill: #0369A1; opacity: .6; display: block; }

    .input-wrap input {
      width: 100%;
      padding: 10px 12px 10px 38px;
      font-size: .9375rem;
      font-family: inherit;
      color: #0C4A6E;
      background: #F0F9FF;
      border: 1.5px solid #BAE6FD;
      border-radius: 8px;
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
      height: 44px;
    }

    .input-wrap input:focus {
      border-color: #0369A1;
      box-shadow: 0 0 0 3px rgba(3, 105, 161, .12);
      background: #fff;
    }

    .input-wrap input::placeholder { color: #7DD3FC; }

    .field-error {
      display: none;
      font-size: .75rem;
      color: #EF4444;
      margin-top: 4px;
    }

    .field.invalid .input-wrap input {
      border-color: #EF4444;
      background: #fff;
    }

    .field.invalid .field-error { display: block; }

    /* ── Submit Button ────────────────────────────────────── */
    .btn-primary {
      width: 100%;
      height: 44px;
      background: linear-gradient(135deg, #0369A1 0%, #0EA5E9 100%);
      color: #fff;
      font-size: .9375rem;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
      letter-spacing: .01em;
    }

    .btn-primary:hover:not(:disabled) { opacity: .9; }
    .btn-primary:active:not(:disabled) { transform: scale(.99); }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; }

    .btn-primary .spinner {
      display: none;
      width: 17px; height: 17px;
      animation: spin .7s linear infinite;
    }

    .btn-primary.loading .spinner { display: block; }
    .btn-primary.loading .btn-label { display: none; }

    .btn-ghost {
      width: 100%;
      height: 36px;
      background: transparent;
      color: #0369A1;
      font-size: .875rem;
      font-weight: 500;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
      opacity: .7;
    }

    .btn-ghost:hover { background: #E0F2FE; opacity: 1; }

    /* ── Divider ──────────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
    }

    .divider-line { flex: 1; height: 1px; background: #BAE6FD; }

    .divider-text {
      font-size: .75rem;
      color: #0369A1;
      opacity: .55;
      white-space: nowrap;
      font-weight: 500;
    }

    /* ── SSO Buttons ──────────────────────────────────────── */
    .sso-buttons { display: flex; gap: 10px; }

    .sso-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      min-height: 44px;
      border: 1.5px solid #BAE6FD;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      font-size: .875rem;
      font-weight: 500;
      font-family: inherit;
      color: #0C4A6E;
    }

    .sso-btn:hover { background: #F0F9FF; border-color: #7DD3FC; }
    .sso-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    .sso-btn--apple {
      background: #000;
      border-color: #000;
      color: #fff;
    }

    .sso-btn--apple svg { fill: #fff; }
    .sso-btn--apple:hover { background: #1a1a1a; border-color: #1a1a1a; }

    /* ── Animations ───────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card { animation: fadeIn .25s ease-out both; }

    /* ── Accessibility ────────────────────────────────────── */
    :focus-visible {
      outline: 2px solid #0369A1;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }

    /* ── Mobile ───────────────────────────────────────────── */
    @media (max-width: 480px) {
      body { padding: 16px; background: #fff; }
      .card {
        padding: 32px 20px;
        box-shadow: none;
        border: none;
        border-radius: 0;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="card" role="main">

    <!-- Header -->
    <header class="header">
      <div class="logo-wrap" aria-hidden="true">
        <!-- Shield / lock icon — identity & security -->
        <svg viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4c1.4 0 2.8.47 3.93 1.4l-7.55 7.55A5.96 5.96 0 0 1 6 10c0-3.31 2.69-6 6-6zm0 12c-1.4 0-2.8-.47-3.93-1.4l7.55-7.55A5.96 5.96 0 0 1 18 10c0 3.31-2.69 6-6 6z"/>
        </svg>
      </div>
      <h1>歡迎回來</h1>
      <p>請登入以繼續</p>
    </header>

    <!-- Error Banner -->
    <div class="error-banner" id="errorBanner" role="alert" aria-live="polite">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      <span id="errorMsg">帳號或密碼錯誤，請重試。</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" method="post" action="/login" novalidate>
      <input type="hidden" name="_csrf" id="csrfToken" />

      <div class="field" id="fieldUsername">
        <label for="username">帳號</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
          </span>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            placeholder="請輸入帳號"
            aria-required="true"
            aria-describedby="usernameError"
          />
        </div>
        <div class="field-error" id="usernameError" role="alert">帳號不可為空</div>
      </div>

      <div class="field field-mb" id="fieldPassword">
        <label for="password">密碼</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          </span>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="請輸入密碼"
            aria-required="true"
            aria-describedby="passwordError"
          />
        </div>
        <div class="field-error" id="passwordError" role="alert">密碼不可為空</div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <path d="M12 2a10 10 0 0 1 10 10"/>
        </svg>
        <span class="btn-label">登入</span>
      </button>
      <button type="button" class="btn-ghost" id="resetBtn">清除</button>
    </form>

    <!-- SSO -->
    <div class="divider" aria-hidden="true">
      <span class="divider-line"></span>
      <span class="divider-text">或使用第三方帳號登入</span>
      <span class="divider-line"></span>
    </div>

    <div class="sso-buttons" role="group" aria-label="第三方登入選項">

      <!-- Google -->
      <button type="button" class="sso-btn" id="googleBtn" aria-label="使用 Google 帳號登入">
        <svg viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Google</span>
      </button>

      <!-- Apple -->
      <button type="button" class="sso-btn sso-btn--apple" id="appleBtn" aria-label="使用 Apple ID 登入">
        <svg viewBox="0 0 24 24">
          <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
        </svg>
        <span>Apple</span>
      </button>

    </div>


  </div>

  <script>
    (function () {
      'use strict';

      // ── Config ───────────────────────────────────────────────
      // 若此頁面由認證中心本身提供（static resource），保持 AUTH_BASE = ''。
      // 若部署在不同 origin，改為認證中心的完整 URL，例如：
      // const AUTH_BASE = 'https://auth.example.com';
      const AUTH_BASE = '';

      // ── Elements ─────────────────────────────────────────────
      const form        = document.getElementById('loginForm');
      const submitBtn   = document.getElementById('submitBtn');
      const resetBtn    = document.getElementById('resetBtn');
      const csrfInput   = document.getElementById('csrfToken');
      const errorBanner = document.getElementById('errorBanner');
      const errorMsg    = document.getElementById('errorMsg');
      const googleBtn   = document.getElementById('googleBtn');
      const appleBtn    = document.getElementById('appleBtn');
      const fUsername   = document.getElementById('fieldUsername');
      const fPassword   = document.getElementById('fieldPassword');
      const inUsername  = document.getElementById('username');
      const inPassword  = document.getElementById('password');

      // 將 ?continue 帶入 form action，讓 HttpSessionRequestCache 能比對已儲存的請求
      const continueParam = new URLSearchParams(window.location.search).has('continue')
        ? '?continue'
        : '';
      form.action = AUTH_BASE + '/login' + continueParam;

      // ── Show error from URL param ─────────────────────────────
      const params = new URLSearchParams(window.location.search);
      if (params.has('error')) {
        const msg = params.get('error');
        errorMsg.textContent = (msg && msg !== 'true')
          ? decodeURIComponent(msg)
          : '帳號或密碼錯誤，請重試。';
        errorBanner.classList.add('visible');
      }

      // ── Fetch CSRF token ──────────────────────────────────────
      async function fetchCsrf() {
        try {
          const res = await fetch(AUTH_BASE + '/csrf-token', { credentials: 'include' });
          if (!res.ok) return;
          const data = await res.json();
          csrfInput.value = data.token ?? data.value ?? '';
        } catch (_) { /* 伺服器未提供時跳過 */ }
      }

      fetchCsrf();

      // ── Validation ────────────────────────────────────────────
      function validate() {
        let valid = true;
        if (!inUsername.value.trim()) {
          fUsername.classList.add('invalid');
          valid = false;
        } else { fUsername.classList.remove('invalid'); }

        if (!inPassword.value.trim()) {
          fPassword.classList.add('invalid');
          valid = false;
        } else { fPassword.classList.remove('invalid'); }

        return valid;
      }

      inUsername.addEventListener('input', () => fUsername.classList.remove('invalid'));
      inPassword.addEventListener('input', () => fPassword.classList.remove('invalid'));

      // ── Form Submit ───────────────────────────────────────────
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!validate()) return;

        submitBtn.disabled = true;
        submitBtn.classList.add('loading');

        await fetchCsrf();   // 確保 CSRF token 最新
        form.submit();
      });

      // ── Reset ─────────────────────────────────────────────────
      resetBtn.addEventListener('click', () => {
        inUsername.value = '';
        inPassword.value = '';
        fUsername.classList.remove('invalid');
        fPassword.classList.remove('invalid');
        errorBanner.classList.remove('visible');
      });

      // ── Social Login ──────────────────────────────────────────
      googleBtn.addEventListener('click', () => {
        window.location.href = AUTH_BASE + '/oauth2/authorization/google';
      });

      appleBtn.addEventListener('click', () => {
        window.location.href = AUTH_BASE + '/oauth2/authorization/apple';
      });

    })();
  </script>
</body>
</html>
