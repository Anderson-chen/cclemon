<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>伺服器錯誤</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F0F9FF;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #0C4A6E;
    }
    .card {
      text-align: center;
      padding: 40px 32px;
      background: #fff;
      border-radius: 16px;
      border: 1px solid #BAE6FD;
      box-shadow: 0 4px 24px rgba(3,105,161,.1);
      max-width: 380px;
      width: 100%;
      animation: fadeIn .2s ease-out both;
    }
    .icon {
      width: 64px; height: 64px;
      background: #FFF7ED;
      border: 1.5px solid #FED7AA;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .icon svg { width: 32px; height: 32px; fill: #F97316; }
    .code {
      font-size: 3rem;
      font-weight: 800;
      color: #BAE6FD;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0C4A6E;
      margin-bottom: 8px;
    }
    p {
      font-size: .875rem;
      color: #64748B;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .actions { display: flex; gap: 8px; justify-content: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      background: linear-gradient(135deg, #0369A1, #0EA5E9);
      color: #fff;
      font-size: .875rem;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .9; }
    .btn svg { width: 16px; height: 16px; fill: #fff; }
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      background: transparent;
      color: #64748B;
      font-size: .875rem;
      font-weight: 500;
      font-family: inherit;
      border: 1.5px solid #CBD5E1;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, color .15s;
    }
    .btn-ghost:hover { background: #F1F5F9; color: #0C4A6E; }
    .btn-ghost svg { width: 16px; height: 16px; fill: currentColor; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
    </div>
    <div class="code">500</div>
    <h1>伺服器發生錯誤</h1>
    <p>系統暫時無法處理您的請求。<br>請稍後再試，或重新啟動授權流程。</p>
    <div class="actions">
      <a href="javascript:history.back()" class="btn-ghost">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        返回
      </a>
      <a href="javascript:location.reload()" class="btn">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        重新整理
      </a>
    </div>
  </div>
</body>
</html>
