<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>頁面不存在</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F0F9FF;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #0C4A6E;
    }
    .card {
      text-align: center;
      padding: 40px 32px;
      background: #fff;
      border-radius: 16px;
      border: 1px solid #BAE6FD;
      box-shadow: 0 4px 24px rgba(3,105,161,.1);
      max-width: 380px;
      width: 100%;
      animation: fadeIn .2s ease-out both;
    }
    .icon {
      width: 64px; height: 64px;
      background: #FEF2F2;
      border: 1.5px solid #FECACA;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .icon svg { width: 32px; height: 32px; fill: #EF4444; }
    .code {
      font-size: 3rem;
      font-weight: 800;
      color: #BAE6FD;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0C4A6E;
      margin-bottom: 8px;
    }
    p {
      font-size: .875rem;
      color: #64748B;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      background: linear-gradient(135deg, #0369A1, #0EA5E9);
      color: #fff;
      font-size: .875rem;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .9; }
    .btn svg { width: 16px; height: 16px; fill: #fff; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    </div>
    <div class="code">404</div>
    <h1>找不到此頁面</h1>
    <p>您要存取的頁面不存在。<br>請返回您的應用程式重新操作。</p>
    <a href="javascript:history.back()" class="btn">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      返回上一頁
    </a>
  </div>
</body>
</html>
