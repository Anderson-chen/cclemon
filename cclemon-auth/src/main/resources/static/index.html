<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>授權完成</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F0F9FF;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0C4A6E;
    }
    .card {
      text-align: center;
      padding: 40px 32px;
      background: #fff;
      border-radius: 16px;
      border: 1px solid #BAE6FD;
      box-shadow: 0 4px 24px rgba(3,105,161,.1);
      max-width: 360px;
      width: 100%;
    }
    .icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #0369A1, #0EA5E9);
      border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .icon svg { width: 28px; height: 28px; fill: #fff; }
    h1 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
    p  { font-size: .875rem; color: #64748B; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
    </div>
    <h1>操作完成</h1>
    <p>請關閉此頁面，<br>或返回您的應用程式繼續操作。</p>
  </div>
</body>
</html>
